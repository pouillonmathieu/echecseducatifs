<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="author" content="Mathieu Pouillon">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le cheval de la reine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../css/commun.css?v=202611221652">
<link rel="stylesheet" href="../../css/jeux.css?v=202611221652">
<link rel="stylesheet" href="../../css/echiquier.css?v=202611221652">
<link rel="stylesheet" href="cheval.css?v=202611221652">
<script src="../../js/commun.js?v=202611221652"></script>
</head>
<body data-mode="libre" data-chrono="non">
<!-- illustrations des boutons : la dame et le cavalier sur un petit échiquier -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mini-cheval" viewBox="0 0 48 48">
    <rect x="4" y="4" width="40" height="40" rx="7" style="fill:#FBFBF8;stroke:#2A2E38" stroke-width="1.4"/>
    <rect x="9" y="9" width="30" height="30" style="fill:var(--plateau-claire)"/>
    <rect x="24" y="9" width="15" height="15" style="fill:var(--plateau-foncee)"/><rect x="9" y="24" width="15" height="15" style="fill:var(--plateau-foncee)"/>
    <use href="#piece-cavalier-noir" x="24" y="9" width="15" height="15"/>
    <use href="#piece-dame-blanc" x="9" y="24" width="15" height="15"/>
  </symbol>
  <symbol id="ico-libre" viewBox="0 0 48 48"><use href="#mini-cheval" width="48" height="48"/></symbol>
  <symbol id="ico-defi" viewBox="0 0 48 48">
    <use href="#mini-cheval" width="48" height="48"/>
    <circle cx="37" cy="37" r="10" style="fill:var(--or);stroke:var(--surface)" stroke-width="2"/>
    <path d="M37 31.2l1.8 3.7 4 .5-3 2.8.8 4L37 40.2l-3.6 2 .8-4-3-2.8 4-.5Z" style="fill:var(--surface)"/>
  </symbol>
  <symbol id="ico-chrono" viewBox="0 0 48 48">
    <use href="#mini-cheval" width="48" height="48"/>
    <circle cx="37" cy="37" r="10" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>
    <circle cx="37" cy="38.6" r="5" style="fill:none;stroke:var(--sur-accent)" stroke-width="1.7"/>
    <path d="M37 38.6l2.3-2.1M37 31.6v1.4M35.4 31.4h3.2M41.2 33.6l1-1" style="fill:none;stroke:var(--sur-accent)" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
</svg>

<main class="ecran ecran-cheval">
  <header class="barre">
    <a class="bouton-icone seulement-libre" href="../../index.html" aria-label="Retour à l'accueil" title="Accueil" data-hors-artifact>
      <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
    </a>
    <button id="btn-retour" class="bouton-icone bouton-illus seulement-defi" type="button" aria-label="Quitter le défi et revenir au mode libre" title="Mode libre">
      <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-libre"/></svg>
    </button>
    <h1 class="titre" id="titre">Le cheval de la reine</h1>
    <button id="btn-defis" class="bouton-defis seulement-libre" type="button" aria-haspopup="dialog" title="Défis">
      <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-defi"/></svg>
      <span>Défis</span>
    </button>
    <div class="reglages">
      <button id="btn-reglages" class="bouton-icone" type="button" aria-label="Réglages" title="Réglages" aria-controls="panneau-reglages" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
      <div id="panneau-reglages" class="panneau" hidden>
        <button id="reg-danger" class="ligne-reglage" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5v5.5M12 16.2v.3"/></svg>
          <span>Cases dangereuses<small>Aide : les cases où l'adversaire peut te prendre sont en rouge</small></span><span class="interrupteur" aria-hidden="true"></span>
        </button>
        <button id="reg-coordonnees" class="ligne-reglage" type="button">
          <svg viewBox="0 0 24 24"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3.5 6v2M3.5 11v2M10 21h2M15 21h2"/></svg>
          <span>Lettres et chiffres</span><span class="interrupteur" aria-hidden="true"></span>
        </button>
        <button id="reg-son" class="ligne-reglage" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>
          <span>Son</span><span class="interrupteur" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- progression des défis -->
  <div class="bandeau-defi seulement-defi">
    <ol id="points" class="points" aria-label="Progression des défis"></ol>
    <div class="minuteur seulement-chrono" aria-hidden="true"><div id="minuteur-barre"></div></div>
  </div>

  <section class="jeu-cheval">
    <div class="colonne-plateau">
      <div class="choix-jeu seulement-libre">
        <div class="choix-ligne" id="reg-camp" role="group" aria-label="Pièce jouée">
          <button type="button" class="avec-texte" data-camp="reine" title="Tu joues la dame : attrape le cavalier"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#piece-dame-blanc"/></svg><span class="texte-choix">Dame</span></button>
          <button type="button" class="avec-texte" data-camp="cavalier" title="Tu joues le cavalier : échappe à la dame"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#piece-cavalier-blanc"/></svg><span class="texte-choix">Cavalier</span></button>
          <button type="button" class="avec-texte" data-camp="deux" title="Deux joueurs : l'un joue la dame, l'autre le cavalier"><span class="deux-pieces" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#piece-dame-blanc"/></svg><svg viewBox="0 0 100 100"><use href="#piece-cavalier-noir"/></svg></span><span class="texte-choix">2 joueurs</span></button>
        </div>
        <div class="choix-ligne choix-niveau" id="reg-niveau" role="group" aria-label="Niveau">
          <button type="button" class="avec-texte" data-niveau="facile" title="L'adversaire fait des erreurs"><svg viewBox="0 0 24 24" class="barres" aria-hidden="true"><rect x="3" y="16" width="5" height="5" rx="1.5" class="pleine"/><rect x="10" y="11" width="5" height="10" rx="1.5" class="vide"/><rect x="17" y="6" width="5" height="15" rx="1.5" class="vide"/></svg><span class="texte-choix">Facile</span></button>
          <button type="button" class="avec-texte" data-niveau="difficile" title="L'adversaire joue parfaitement"><svg viewBox="0 0 24 24" class="barres" aria-hidden="true"><rect x="3" y="16" width="5" height="5" rx="1.5" class="pleine"/><rect x="10" y="11" width="5" height="10" rx="1.5" class="pleine"/><rect x="17" y="6" width="5" height="15" rx="1.5" class="pleine"/></svg><span class="texte-choix">Difficile</span></button>
        </div>
      </div>
      <div data-ajuste id="echiquier" class="plateau-cheval"></div>
      <div class="navigation-coups" id="navigation" role="group" aria-label="Revoir les coups">
        <button type="button" class="bouton-icone" data-nav="debut" aria-label="Position de départ" title="Départ"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6Z"/></svg></button>
        <button type="button" class="bouton-icone" data-nav="prec" aria-label="Coup précédent" title="Coup précédent"><svg viewBox="0 0 24 24"><path d="M15 6l-7 6 7 6"/></svg></button>
        <span class="nav-numero" aria-live="polite">Départ</span>
        <button type="button" class="bouton-icone" data-nav="suiv" aria-label="Coup suivant" title="Coup suivant"><svg viewBox="0 0 24 24"><path d="M9 6l7 6-7 6"/></svg></button>
        <button type="button" class="bouton-icone" data-nav="fin" aria-label="Dernier coup" title="Dernier coup"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6Z"/></svg></button>
      </div>
    </div>

    <div class="panneau-cheval">
      <div class="compteur">
        <p class="compteur-nombre"><span id="coups">0</span> <span id="coups-mot">coup</span></p>
        <p class="etat" id="etat" aria-live="polite"></p>
      </div>
      <p class="bareme" id="bareme"></p>
      <p class="etoiles-partie seulement-defi" id="etoiles-partie" aria-live="polite"></p>
      <button id="btn-suivante" class="bouton-principal" type="button" hidden>
        Partie suivante
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="actions-partie seulement-libre">
        <button id="btn-recommencer" class="bouton-secondaire" type="button" title="Reprendre la même position de départ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4h4"/></svg>
          Recommencer
        </button>
        <button id="btn-nouvelle" class="bouton-secondaire" type="button" title="Une nouvelle position au hasard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Nouvelle partie
        </button>
        <button id="btn-solution" class="bouton-secondaire" type="button" title="Voir une partie parfaite depuis le départ" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          Solution
        </button>
      </div>
    </div>
  </section>

  <footer class="signature">Créé par Mathieu Pouillon</footer>
</main>


<!-- choix du défi -->
<div id="choix-defi" class="voile" hidden>
  <div class="carte-choix" role="dialog" aria-modal="true" aria-labelledby="choix-titre">
    <div class="carte-choix-tete">
      <h2 id="choix-titre">Défis</h2>
      <button id="btn-fermer-choix" class="bouton-icone" type="button" aria-label="Fermer" title="Fermer">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="carte-choix-intro" id="choix-intro">5 parties d'affilée, avec la pièce et le niveau choisis : jusqu'à 15 étoiles.</p>
    <div class="tuiles">
      <button id="mode-defi" class="tuile" type="button">
        <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-defi"/></svg>
        <span class="tuile-titre">Sans chrono</span>
        <span class="tuile-sous">Prends ton temps</span>
      </button>
      <button id="mode-chrono" class="tuile" type="button">
        <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-chrono"/></svg>
        <span class="tuile-titre">Chrono</span>
        <span class="tuile-sous">10 secondes par coup</span>
      </button>
    </div>
  </div>
</div>

<!-- fin de la partie ou du défi -->
<div id="resultats" class="voile" hidden>
  <div class="pluie" id="pluie" aria-hidden="true"></div>
  <div class="carte-resultats" role="dialog" aria-modal="true" aria-labelledby="res-titre">
    <div class="etoiles" id="etoiles" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
    </div>
    <h2 id="res-titre" class="res-titre">Bravo !</h2>
    <p class="res-score"><span id="res-score">0</span><span class="res-sur" id="res-sur">coups</span></p>
    <p id="res-detail" class="res-temps"></p>
    <ol id="res-liste" class="res-liste" aria-label="Détail des parties" hidden></ol>
    <p id="res-temps" class="res-temps" hidden></p>
    <div class="res-actions">
      <button id="btn-nouvelle-res" class="bouton-principal seulement-libre" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle partie
      </button>
      <button id="btn-rejouer" class="bouton-secondaire" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4h4"/></svg>
        Rejouer
      </button>
      <button id="btn-revoir" class="bouton-secondaire" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        Voir l'échiquier
      </button>
      <button id="btn-menu" class="bouton-secondaire seulement-defi" type="button">
        <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-libre"/></svg>
        Mode libre
      </button>
    </div>
  </div>
</div>

<script src="../../js/pieces.js?v=202611221652"></script>
<script src="../../js/sons.js?v=202611221652"></script>
<script src="../../js/ui.js?v=202611221652"></script>
<script src="../../js/echiquier.js?v=202611221652"></script>
<script src="../../js/revoir.js?v=202611221652"></script>
<script src="../../js/glisser.js?v=202611221652"></script>
<script src="../../js/aide.js?v=202611221652"></script>
<script src="../../js/pom.js?v=202611221652"></script>
<script src="cheval.js?v=202611221652"></script>
</body>
</html>
