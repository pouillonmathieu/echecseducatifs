<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="author" content="Mathieu Pouillon">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les ouvertures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../css/commun.css?v=202611231535">
<link rel="stylesheet" href="../../css/jeux.css?v=202611231535">
<link rel="stylesheet" href="../../css/echiquier.css?v=202611231535">
<link rel="stylesheet" href="ouvertures.css?v=202611231535">
<link rel="stylesheet" href="fiche.css?v=202611231535">
<script src="../../js/commun.js?v=202611231535"></script>
<script src="../../js/compte.js?v=202611231535"></script>
</head>
<body>
<main class="ecran ecran-fiche">
  <header class="barre">
    <a class="bouton-icone" href="../../index.html" aria-label="Retour à l'accueil" title="Accueil" data-hors-artifact>
      <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
    </a>
    <h1 class="titre" id="titre">Les ouvertures</h1>
    <a class="bouton-defis" href="index.html" title="Quiz des ouvertures">
      <svg viewBox="0 0 24 24" class="ico-quiz" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17h.01"/></svg>
      <span>Quiz</span>
    </a>
  </header>

  <!-- une ouverture (fiche.html?o=<identifiant>) -->
  <article class="fiche" id="fiche" hidden>
    <div class="fiche-haut">
      <div class="colonne-plateau">
        <div id="echiquier" class="plateau-fiche"></div>
        <div class="navigation-coups" id="navigation" role="group" aria-label="Revoir les coups">
          <button type="button" class="bouton-icone" data-nav="debut" aria-label="Position de départ" title="Départ"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6Z"/></svg></button>
          <button type="button" class="bouton-icone" data-nav="prec" aria-label="Coup précédent" title="Coup précédent"><svg viewBox="0 0 24 24"><path d="M15 6l-7 6 7 6"/></svg></button>
          <span class="nav-numero" aria-live="polite">Départ</span>
          <button type="button" class="bouton-icone" data-nav="suiv" aria-label="Coup suivant" title="Coup suivant"><svg viewBox="0 0 24 24"><path d="M9 6l7 6-7 6"/></svg></button>
          <button type="button" class="bouton-icone" data-nav="fin" aria-label="Dernier coup" title="Dernier coup"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6Z"/></svg></button>
        </div>
        <p class="ligne-vue" id="ligne-vue" hidden>
          <span id="ligne-vue-nom"></span>
          <button type="button" class="bouton-lien" id="btn-ligne-principale">Revenir à l'ouverture</button>
        </p>
        <p class="liste-coups" id="liste-fiche" aria-label="Coups"></p>
      </div>

      <div class="fiche-texte">
        <p class="etiquettes"><span class="etiquette-niveau" id="niveau"></span><span id="parent"></span></p>
        <h2 class="fiche-nom" id="nom"></h2>
        <h3>L'idée</h3>
        <p id="resume" class="fiche-resume"></p>
        <h3>À retenir</h3>
        <ul id="idees" class="fiche-idees"></ul>
        <div class="fiche-actions">
          <a class="bouton-principal" id="btn-rejouer-fiche" href="index.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20h12M8 20l1-5h6l1 5M12 15V9"/><circle cx="12" cy="6" r="3"/></svg>
            Rejouer l'ouverture
          </a>
        </div>
      </div>
    </div>

    <section class="fiche-section">
      <h3>Les principales variantes</h3>
      <p class="fiche-intro">Clique sur une variante pour la voir sur l'échiquier.</p>
      <div class="variantes" id="variantes"></div>
    </section>

    <section class="fiche-section">
      <h3>Pour aller plus loin</h3>
      <ul class="liens" id="liens"></ul>
    </section>
  </article>

  <!-- toutes les ouvertures (fiche.html sans paramètre) -->
  <section class="sommaire" id="sommaire" hidden>
    <p class="fiche-intro">Toutes les ouvertures du quiz, avec leurs idées et leurs variantes.</p>
    <div id="sommaire-niveaux"></div>
  </section>

  <footer class="signature">Créé par Mathieu Pouillon</footer>
</main>

<script src="../../js/pieces.js?v=202611231535"></script>
<script src="../../js/echiquier.js?v=202611231535"></script>
<script src="../../js/revoir.js?v=202611231535"></script>
<script src="donnees.js?v=202611231535"></script>
<script src="fiche.js?v=202611231535"></script>
</body>
</html>
