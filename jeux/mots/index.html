<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="author" content="Mathieu Pouillon">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comment ça s'appelle ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../css/commun.css?v=202611221722">
<link rel="stylesheet" href="../../css/jeux.css?v=202611221722">
<link rel="stylesheet" href="../../css/echiquier.css?v=202611221722">
<link rel="stylesheet" href="mots.css?v=202611221722">
<script src="../../js/commun.js?v=202611221722"></script>
</head>
<body data-mode="libre" data-chrono="non">
<!-- illustrations des boutons : une pièce et son nom en cases -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mini-mots" viewBox="0 0 48 48">
    <rect x="4" y="4" width="40" height="40" rx="7" style="fill:#FBFBF8;stroke:#2A2E38" stroke-width="1.4"/>
    <use href="#piece-cavalier-blanc" x="12" y="6" width="24" height="24"/>
    <g style="fill:#DCEEE5;stroke:#2E7D5B" stroke-width="1.3"><rect x="9" y="31" width="8" height="9" rx="2"/><rect x="20" y="31" width="8" height="9" rx="2"/></g>
    <rect x="31" y="31" width="8" height="9" rx="2" style="fill:#FFFFFF;stroke:#2A2E38;stroke-opacity:.35" stroke-width="1.3"/>
  </symbol>
  <symbol id="ico-libre" viewBox="0 0 48 48"><use href="#mini-mots" width="48" height="48"/></symbol>
  <symbol id="ico-defi" viewBox="0 0 48 48">
    <use href="#mini-mots" width="48" height="48"/>
    <circle cx="37" cy="37" r="10" style="fill:var(--or);stroke:var(--surface)" stroke-width="2"/>
    <path d="M37 31.2l1.8 3.7 4 .5-3 2.8.8 4L37 40.2l-3.6 2 .8-4-3-2.8 4-.5Z" style="fill:var(--surface)"/>
  </symbol>
  <symbol id="ico-chrono" viewBox="0 0 48 48">
    <use href="#mini-mots" width="48" height="48"/>
    <circle cx="37" cy="37" r="10" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>
    <circle cx="37" cy="38.6" r="5" style="fill:none;stroke:var(--sur-accent)" stroke-width="1.7"/>
    <path d="M37 38.6l2.3-2.1M37 31.6v1.4M35.4 31.4h3.2M41.2 33.6l1-1" style="fill:none;stroke:var(--sur-accent)" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
</svg>

<main class="ecran ecran-mots">
  <header class="barre">
    <a class="bouton-icone seulement-libre" href="../../index.html" aria-label="Retour à l'accueil" title="Accueil" data-hors-artifact>
      <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
    </a>
    <button id="btn-retour" class="bouton-icone bouton-illus seulement-defi" type="button" aria-label="Quitter le défi et revenir au mode libre" title="Mode libre">
      <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-libre"/></svg>
    </button>
    <h1 class="titre" id="titre">Comment ça s'appelle ?</h1>
    <button id="btn-defis" class="bouton-defis seulement-libre" type="button" aria-haspopup="dialog" title="Défis">
      <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-defi"/></svg>
      <span>Défis</span>
    </button>
    <div class="reglages">
      <button id="btn-reglages" class="bouton-icone" type="button" aria-label="Réglages" title="Réglages" aria-controls="panneau-reglages" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
      <div id="panneau-reglages" class="panneau" hidden>
        <button id="reg-son" class="ligne-reglage" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>
          <span>Son</span><span class="interrupteur" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- progression des défis -->
  <div class="bandeau-defi seulement-defi">
    <ol id="points" class="points" aria-label="Progression des défis"></ol>
    <div class="minuteur seulement-chrono" aria-hidden="true"><div id="minuteur-barre"></div></div>
  </div>

  <section class="jeu-mots">
    <div class="colonne-illus">
      <div class="choix-jeu seulement-libre">
        <label class="choix-ligne choix-langue" title="Langue du mot à écrire">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c-3 3.2-3 13.8 0 17M12 3.5c3 3.2 3 13.8 0 17"/></svg>
          <select id="reg-langue" aria-label="Langue du mot à écrire"></select>
        </label>
        <div class="choix-ligne choix-niveau" id="reg-niveau" role="group" aria-label="Niveau">
          <button type="button" class="avec-texte" data-niveau="facile" title="Les pièces, l'échiquier, échec et mat"><svg viewBox="0 0 24 24" class="barres" aria-hidden="true"><rect x="3" y="16" width="5" height="5" rx="1.5" class="pleine"/><rect x="10" y="11" width="5" height="10" rx="1.5" class="vide"/><rect x="17" y="6" width="5" height="15" rx="1.5" class="vide"/></svg><span class="texte-niveau">Facile</span></button>
          <button type="button" class="avec-texte" data-niveau="difficile" title="En plus : roque, fourchette, clouage, ouverture…"><svg viewBox="0 0 24 24" class="barres" aria-hidden="true"><rect x="3" y="16" width="5" height="5" rx="1.5" class="pleine"/><rect x="10" y="11" width="5" height="10" rx="1.5" class="pleine"/><rect x="17" y="6" width="5" height="15" rx="1.5" class="pleine"/></svg><span class="texte-niveau">Difficile</span></button>
        </div>
      </div>
      <div class="cadre-illus" data-ajuste>
        <div id="illus" class="illus-mots" aria-hidden="true"></div>
        <span id="badge" class="badge-illus" hidden></span>
      </div>
    </div>

    <div class="panneau-mots">

      <div class="carte-mot">
        <!-- le haut-parleur et le compteur de la série, en haut de la carte -->
        <div class="tete-mot">
          <button id="btn-lire" class="bouton-icone btn-lire" type="button" aria-label="Écouter le mot" title="Écouter le mot">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>
          </button>
          <span class="progres" id="progres" aria-live="polite">1 / 12</span>
        </div>
        <div id="mot" class="mot" aria-live="polite"></div>
        <p id="apercu" class="apercu" hidden></p>
        <p id="retour" class="retour-mot" aria-live="polite"></p>
      </div>

      <div id="clavier" class="clavier" role="group" aria-label="Clavier"></div>

      <div class="actions-mot">
        <button id="btn-indice" class="bouton-secondaire" type="button" title="Ne garder que les lettres du mot sur le clavier">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>
          Indice
        </button>
        <button id="btn-solution" class="bouton-secondaire" type="button" title="Voir le mot et passer au suivant">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          Solution
        </button>
        <button id="btn-suivant" class="bouton-principal" type="button" hidden>
          Suivant
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </section>

  <footer class="signature">Créé par Mathieu Pouillon</footer>
</main>

<!-- choix du défi -->
<div id="choix-defi" class="voile" hidden>
  <div class="carte-choix" role="dialog" aria-modal="true" aria-labelledby="choix-titre">
    <div class="carte-choix-tete">
      <h2 id="choix-titre">Défis</h2>
      <button id="btn-fermer-choix" class="bouton-icone" type="button" aria-label="Fermer" title="Fermer">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="carte-choix-intro">10 mots à écrire, dans la langue et au niveau choisis.</p>
    <div class="tuiles">
      <button id="mode-defi" class="tuile" type="button">
        <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-defi"/></svg>
        <span class="tuile-titre">Sans chrono</span>
        <span class="tuile-sous">Prends ton temps</span>
      </button>
      <button id="mode-chrono" class="tuile" type="button">
        <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-chrono"/></svg>
        <span class="tuile-titre">Chrono</span>
        <span class="tuile-sous">30 secondes par mot</span>
      </button>
    </div>
  </div>
</div>

<!-- fin de la série ou du défi -->
<div id="resultats" class="voile" hidden>
  <div class="pluie" id="pluie" aria-hidden="true"></div>
  <div class="carte-resultats" role="dialog" aria-modal="true" aria-labelledby="res-titre">
    <div class="etoiles" id="etoiles" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
    </div>
    <h2 id="res-titre" class="res-titre">Bravo !</h2>
    <p class="res-score"><span id="res-score">0</span><span class="res-sur" id="res-sur">/ 12</span></p>
    <p id="res-detail" class="res-temps"></p>
    <ol id="res-liste" class="res-liste" aria-label="Détail des mots" hidden></ol>
    <p id="res-temps" class="res-temps" hidden></p>
    <div class="res-actions">
      <button id="btn-rejouer" class="bouton-principal" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4h4"/></svg>
        Rejouer
      </button>
      <button id="btn-menu" class="bouton-secondaire seulement-defi" type="button">
        <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-libre"/></svg>
        Mode libre
      </button>
    </div>
  </div>
</div>

<script src="../../js/pieces.js?v=202611221722"></script>
<script src="../../js/sons.js?v=202611221722"></script>
<script src="../../js/ui.js?v=202611221722"></script>
<script src="../../js/echiquier.js?v=202611221722"></script>
<script src="../../js/aide.js?v=202611221722"></script>
<script src="../../js/pom.js?v=202611221722"></script>
<script src="termes.js?v=202611221722"></script>
<script src="mots.js?v=202611221722"></script>
</body>
</html>
