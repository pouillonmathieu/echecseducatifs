<title>Animations de Pom'</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : une scène (Pom' au centre) et, à côté ou dessous, les danses à lancer et les réglages. */
:root {
  --fond: #F3F4F1;
  --surface: #FFFFFF;
  --encre: #22262E;
  --encre-douce: #626A76;
  --ligne: #DCDFDA;
  --accent: #2E7D5B;
  --accent-doux: #DCEEE5;
  --scene: #FBFBF8;
  --scene-sol: #E9E6DC;
  --texte: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #16191E; --surface: #1F242B; --encre: #ECEEF0; --encre-douce: #A2AAB5; --ligne: #333A44;
    --accent: #5CC395; --accent-doux: #1F3A2F; --scene: #262C34; --scene-sol: #313843; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #16191E; --surface: #1F242B; --encre: #ECEEF0; --encre-douce: #A2AAB5; --ligne: #333A44;
  --accent: #5CC395; --accent-doux: #1F3A2F; --scene: #262C34; --scene-sol: #313843; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--fond);
  color: var(--encre);
  font-family: var(--texte);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
main { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header h1 { margin: 0; font-size: clamp(24px, 4vw, 32px); font-weight: 700; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--encre-douce); line-height: 1.5; max-width: 62ch; }

.atelier { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .atelier { grid-template-columns: 1fr; } }

/* la scène : fond clair ou sombre, pour voir les deux versions de Pom' */
.scene {
  position: relative;
  border-radius: 22px;
  border: 1px solid var(--ligne);
  background: var(--scene);
  overflow: hidden;
  aspect-ratio: 9 / 13;
  max-height: 78vh; margin-inline: auto; width: 100%;
  max-width: 100%;
}
.scene[data-fond="sombre"] { background: #20252C; }
.scene[data-fond="clair"] { background: #FBFBF8; }
.scene svg { display: block; width: 100%; height: 100%; }
.legende {
  position: absolute; left: 14px; bottom: 12px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(255, 255, 255, .78); color: #22262E;
  font-size: 13px; font-weight: 600;
}
.scene[data-fond="sombre"] .legende { background: rgba(0, 0, 0, .45); color: #F2F2F2; }

.commandes { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.danses { display: grid; grid-template-columns: 1fr; gap: 8px; }
.danse {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center;
  padding: 12px 14px; border: 2px solid var(--ligne); border-radius: 16px;
  background: var(--surface); color: var(--encre); font: inherit; text-align: left; cursor: pointer;
  transition: border-color .15s, transform .1s;
}
.danse:hover { border-color: var(--accent); }
.danse:active { transform: scale(.98); }
.danse:focus-visible, .bascule button:focus-visible, .outil:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.danse.active { border-color: var(--accent); background: var(--accent-doux); }
.danse .num { min-width: 34px; padding: 0 6px; width: auto; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-doux); color: var(--accent); font-weight: 700; }
.danse.active .num { background: var(--accent); color: var(--surface); }
.danse b { font-size: 16px; }
/* sur téléphone : Pom' moins haut, et les animations en une rangée qui défile juste en dessous, pour voir toute
   l'animation sans avoir à faire défiler la page */
@media (max-width: 760px) {
  main { gap: 10px; }
  .atelier { gap: 10px; }
  .scene { max-height: 60svh; }
  .danses {
    display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; overscroll-behavior-x: contain;
    margin-inline: -16px; padding: 2px 16px 8px; scroll-padding-inline: 16px; scrollbar-width: thin;
  }
  .danse { flex: 0 0 auto; scroll-snap-align: start; padding: 8px 12px 8px 8px; gap: 2px 8px; border-radius: 14px; }
  .danse .num { width: auto; min-width: 28px; height: 28px; font-size: 13px; border-radius: 8px; }
  .danse b { font-size: 15px; white-space: nowrap; }
}
.danse span.sous { color: var(--encre-douce); font-size: 13px; line-height: 1.35; }

.reglages { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bascule { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--ligne); border-radius: 13px; background: var(--surface); }
.bascule button { border: 0; border-radius: 10px; padding: 7px 12px; background: none; color: var(--encre); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.bascule button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.outil { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ligne); border-radius: 13px; padding: 8px 12px; background: var(--surface); color: var(--encre); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.outil[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.note { margin: 0; color: var(--encre-douce); font-size: 13px; line-height: 1.5; }
.galerie { display: flex; flex-direction: column; gap: 10px; }
.galerie h2 { margin: 6px 0 0; font-size: 20px; }
.grille-mains { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.carte-main { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; border: 1px solid var(--ligne); border-radius: 14px; background: var(--scene); text-align: center; min-width: 0; }
.scene[data-fond="sombre"] ~ * .carte-main { background: #20252C; }
.carte-main svg { width: 84px; height: 84px; }
.carte-main b { font-size: 13px; }
.carte-main span { font-size: 12px; color: var(--encre-douce); }
</style>

    g.setAttribute('transform', `translate(510 0) scale(${Math.abs(c) < .02 ? .02 * Math.sign(c || 1) : c} 1) translate(-510 0) translate(${x} ${y}) rotate(${a})`);
    const devant = (cote === 'G' ? Math.sin(t) : -Math.sin(t)) >= -.001;
    const ordre = [...el.pom.children], i = ordre.indexOf(g);
    // derriereG / derriereD : le bras passe derrière le corps (le floss), même de face
    const place = p['devant' + cote] ? 'tout' : p['derriere' + cote] > .5 ? 'derriere' : devant ? 'devant' : 'derriere';
    const bien = place === 'tout' ? i > ordre.indexOf(el.chapeau) : place === 'devant' ? i > ordre.indexOf(el.corps) && i < ordre.indexOf(el.tete) : i < ordre.indexOf(el.corps);
    if (!bien) {
      if (place === 'tout') el.pom.appendChild(g);
      else el.pom.insertBefore(g, place === 'devant' ? el.tete : el.vitAr);
    }
    const d = `M0 0 Q${L / 2} ${b} ${L} 0`;
    g.children[0].setAttribute('d', d);
    g.children[1].setAttribute('d', d);
    const m = g.children[2];
    const type = p['main' + cote];
    m.setAttribute('href', '#main-' + type);
    // la main prolonge le bras : on aligne le poignet du gant sur la fin du bras (tangente de la courbe)
    const tangente = Math.atan2(-b, L / 2) * 180 / Math.PI;
    // un gant dessiné pour l'autre côté du corps est retourné en miroir (il devient l'autre main)
    const miroir = cote !== MAINS[type].cote;
    const entree = miroir ? 180 - MAINS[type].entree : MAINS[type].entree;
    m.setAttribute('transform', `translate(${L} 0) rotate(${tangente - entree + p['p' + cote]}) translate(0 ${p['tape' + cote]}) scale(${miroir ? -1 : 1} 1)`);
  }

  function dessiner(p) {
    el.pom.setAttribute('transform', `translate(${BASE[0] + p.x} ${BASE[1] - p.y}) rotate(${p.rot}) scale(${p.flip} 1) translate(${-BASE[0]} ${-BASE[1]})`);
    el.corps.setAttribute('transform', `translate(${BASE[0]} ${BASE[1]}) skewX(${p.pli}) scale(${p.sx} ${p.sy}) translate(${-BASE[0]} ${-BASE[1]})`);
    const [nx, ny] = pointCorps(p, 508, 458);
    const tx = nx - 508 + p.teteX, ty = ny - 458 - 12 - p.teteY; // la pomme flotte un peu au-dessus du corps
    el.tete.setAttribute('transform', `translate(${tx} ${ty}) rotate(${p.teteRot} 507 365)`);
    // chapeau sur la tête : posé sur la pomme (il cache la queue et la feuille) ; les danses le font s'envoler de là
    const chapY = p.chapY - (chapeauSurTete ? SUR_TETE : 0);
    let queueVue;
    if (p.chapLibre) {
      // le chapeau ne suit plus la tête (il tombe, il est par terre, une main le tient) : position propre
      el.chapeau.setAttribute('transform', `translate(${p.chapLX - 508} ${p.chapLY - 205}) rotate(${p.chapLR} 508 205)`);
      queueVue = 1;
    } else {
      // tête penchée en avant : le chapeau bascule avec elle (il descend un peu et s'écrase en hauteur)
      const ph = rad(p.penche), dyH = 110 * (1 - Math.cos(ph)), sH = (1 + Math.cos(ph)) / 2;
      el.chapeau.setAttribute('transform', `translate(${tx + p.chapX} ${ty - chapY}) rotate(${p.teteRot + p.chapRot} 508 205) translate(0 ${dyH}) translate(508 232) scale(1 ${sH}) translate(-508 -232)`);
      queueVue = Math.max(0, Math.min(1, (chapY + SUR_TETE - 8) / 22));
    }
    // la queue et la feuille : de face, ou vues d'en haut quand la tête penche ; cachées sous le chapeau
    el.queueFeuille.setAttribute('opacity', p.penche > 3 ? 0 : queueVue);
    el.queueDessus.setAttribute('opacity', queueVue);
    bras('G', p); bras('D', p);
    // le visage fait le tour de la pomme : il glisse, se resserre sur le côté et disparaît derrière
    const t = rad(p.tour), c = Math.cos(t), sn = Math.sin(t);

    const ph = rad(p.penche), cph = Math.cos(ph), sph = Math.sin(ph);
    el.visage.setAttribute('transform', `translate(0 ${72 * sph}) translate(0 338) scale(1 ${cph}) translate(0 -338) translate(${507 + 78 * sn} 0) scale(${Math.max(c, .001)} 1) translate(-507 0)`);
    // le dessus de la pomme : le creux de la queue descend du haut de la pomme et s'ouvre ; la queue raccourcit (elle
    // pointe vers nous) et passe devant la pomme
    const haut = 365 - 78 * cph;
    el.dessus.setAttribute('opacity', p.penche > 3 ? 1 : 0);
    el.creux.setAttribute('cy', haut); el.creux.setAttribute('ry', 30 * sph);
    el.creuxFond.setAttribute('cy', haut + 2 * sph); el.creuxFond.setAttribute('ry', 13 * sph);
    el.queueDessus.setAttribute('transform', `translate(0 ${haut - 302}) translate(505 302) scale(1 ${Math.max(.15, cph)}) translate(-505 -302)`);
    el.visage.setAttribute('opacity', c > .05 ? 1 : 0);
    el.feuille.setAttribute('transform', `translate(500 0) scale(${Math.abs(c) < .05 ? .05 * Math.sign(c || 1) : c} 1) translate(-500 0)`);
    el.croix.setAttribute('transform', `translate(507 0) scale(${Math.max(.16, Math.abs(c))} 1) translate(-507 0)`);
    for (const v of [el.vitAv, el.vitAr]) {
      v.setAttribute('opacity', p.vitesse);
      v.style.strokeDashoffset = -p.tour * 2.2;
      [...v.children].forEach(x => { x.style.strokeDashoffset = -p.tour * 2.2; });
    }
    // les yeux : ouverts, fermés de joie, clin d'œil, paupières qui clignent
    // yeux ouverts ou yeux de joie : on passe de l'un à l'autre d'un coup, comme un clignement (pas de fondu)
    const joie = p.joie >= .5;
    el.joie.setAttribute('opacity', joie ? 1 : 0);
    el.ouverts.setAttribute('opacity', joie ? 0 : 1);
    if (joie) { el.fermeG.setAttribute('opacity', 0); el.fermeD.setAttribute('opacity', 0); }
    el.pupilles.forEach(x => x.setAttribute('transform', `translate(${p.regardX} ${p.regardY})`));
    // cligner : la paupière descend dans l'œil, puis l'œil fermé devient un trait (calme) ou un arc rieur (clin d'œil)
    [[p.clinG, 472, 338, el.oeilG, el.fermeG, 0], [p.clinD, 541, 337, el.oeilD, el.fermeD, 1]].forEach(([k, cx, cy, oeil, ferme, i]) => {
      k = Math.max(0, Math.min(1, k));
      const bas = cy - 32 + 64 * Math.min(1, k / .85);
      // paupière triste : elle tombe vers l'extérieur de l'œil (en pente), au lieu de descendre à plat
      const pente = 14 * p.tristesse * (i === 0 ? 1 : -1);
      const g = bas + pente, d = bas - pente;
      el.paupieres[i].setAttribute('d', k > .001 ? `M${cx - 36} 300 H${cx + 36} V${d} Q${cx} ${bas + 7} ${cx - 36} ${g} Z` : '');
      el.bords[i].setAttribute('d', k > .02 && k < .9 ? `M${cx - 34} ${g} Q${cx} ${bas + 7} ${cx + 34} ${d}` : '');
      const f = k >= .85 ? 1 : 0; // l'œil se ferme d'un coup quand la paupière arrive en bas
      oeil.setAttribute('opacity', 1 - f);
      ferme.setAttribute('opacity', f);
      const r = p.clinRieur;
      // yeux plissés « > < » (comme 😖) quand il grimace ; sinon un trait calme ou un arc rieur
      if (p.grimace > .5) ferme.setAttribute('d', i === 0 ? `M${cx - 20} ${cy - 15} L${cx + 14} ${cy + 2} L${cx - 20} ${cy + 18}` : `M${cx + 20} ${cy - 15} L${cx - 14} ${cy + 2} L${cx + 20} ${cy + 18}`);
      else ferme.setAttribute('d', `M${cx - 26} ${cy + 7 + 5 * r} Q${cx} ${cy + 14 - 46 * r} ${cx + 26} ${cy + 7 + 5 * r}`);
    });
    el.etincelle.setAttribute('opacity', p.etincelle);
    el.etincelle.setAttribute('transform', `translate(592 300) rotate(${p.etincelle * 90}) scale(${.4 + .8 * p.etincelle})`);
    el.sourcils.setAttribute('transform', `translate(0 ${-p.sourcils})`);
    el.sG.setAttribute('transform', `translate(0 ${-p.sourcilG}) rotate(${-p.sourcilsPli} 468 288)`);
    el.sD.setAttribute('transform', `translate(0 ${-p.sourcilD}) rotate(${p.sourcilsPli} 545 288)`);
    // les « Z » du sommeil : ils sortent l'un après l'autre de la tête, montent en grossissant et s'effacent
    el.zzz.forEach((z, i) => {
      // p.zzz : le temps écoulé en cycles ; chaque « Z » part un tiers de cycle après le précédent
      const t = p.zzz - i / 3;
      if (t < 0 || p.zzzVisible <= 0) { z.setAttribute('opacity', 0); return; }
      const q = t % 1;
      const x = 585 + p.x + 85 * q + 10 * Math.sin(q * 2 * Math.PI), y = 250 - 190 * q;
      z.setAttribute('opacity', p.zzzVisible * Math.min(1, q / .15) * Math.min(1, (1 - q) / .3));
      z.setAttribute('transform', `translate(${x} ${y}) rotate(-12) scale(${.5 + .8 * q})`);
    });
    // le petit nuage gris : il apparaît au-dessus de la tête et fait tomber quelques gouttes
    const n = Math.max(0, Math.min(1, p.nuage));
    el.nuage.setAttribute('opacity', n);
    el.nuage.setAttribute('transform', `translate(${508 + p.x} -8) scale(${(.7 + .3 * n) * 1.3})`);
    el.gouttes.forEach((g, i) => {
      const q = (p.pluie * 1.4 + i * .37) % 1;
      g.setAttribute('transform', `translate(${(i - 1) * 32} ${18 + q * 70})`);
      g.setAttribute('opacity', p.pluie > 0 ? Math.sin(Math.PI * q) * n : 0);
    });
    // l'ampoule : elle s'allume en grossissant (avec un petit rebond), ses rayons scintillent
    el.ampoule.setAttribute('opacity', Math.min(1, Math.max(0, p.ampoule)));
    el.ampoule.setAttribute('transform', `translate(730 118) scale(${Math.max(0, p.ampoule) * 1.15})`);
    el.rayons.setAttribute('opacity', p.rayons);
    el.rayons.setAttribute('transform', `scale(${.9 + .15 * p.rayons})`);
    // les bulles de pensée : elles apparaissent l'une après l'autre en montant, puis s'effacent
    [...el.pensee.children].forEach((b, i) => {
      const q = p.pensee * 1.6 - i * .28;
      const v = q <= 0 ? 0 : q < .25 ? q / .25 : p.pensee > .92 ? Math.max(0, (1 - p.pensee) / .08) : 1;
      b.setAttribute('opacity', v);
      b.setAttribute('transform', `translate(0 ${-6 * Math.min(1, Math.max(0, q))}) scale(${.6 + .4 * Math.min(1, Math.max(0, q / .25))})`);
      b.style.transformOrigin = `${b.getAttribute('cx')}px ${b.getAttribute('cy')}px`;
    });
    // l'ombre rapetisse quand il saute
    const k = Math.max(.35, 1 - p.y / 520);
    el.ombre.setAttribute('transform', `translate(${510 + p.x} 968) scale(${k} ${k}) translate(-510 -968)`);
    el.ombre.setAttribute('opacity', .35 + .65 * k);
    // les étoiles : elles grandissent puis s'effacent
    [...el.etoiles.children].forEach((s, i) => {
      const [sx, sy, t] = ETOILES[i];
      const q = p.etoiles - i * .05;
      if (q <= 0 || q >= 1) { s.setAttribute('opacity', 0); return; }
      const e = Math.sin(Math.PI * q);
      s.setAttribute('opacity', e);
      s.setAttribute('transform', `translate(${sx} ${sy}) rotate(${q * 120}) scale(${t * (.4 + e)})`);
    });
  }

  // ---------- Pistes : des valeurs clés dans le temps, avec un amorti ----------
  const EASE = {
    lin: (t) => t,
    in: (t) => t * t,
    out: (t) => 1 - (1 - t) * (1 - t),
    io: (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    // dépasse un peu puis revient : effet élastique
    rebond: (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
    ressort: (t) => (t === 0 || t === 1 ? t : Math.pow(2, -9 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI / 3)) + 1),
  };
  // [[temps en ms, valeur, amorti pour y arriver], …]
  function piste(cles) {
    return (ms) => {
      if (ms <= cles[0][0]) return cles[0][1];
      for (let i = 1; i < cles.length; i++) {
        const [t1, v1, e = 'io'] = cles[i];
        const [t0, v0] = cles[i - 1];
        if (ms <= t1) {
          if (typeof v1 === 'string') return ms < t1 ? v0 : v1;
          const k = EASE[e]((ms - t0) / (t1 - t0));
          return v0 + (v1 - v0) * k;
        }
      }
      return cles[cles.length - 1][1];
    };
  }
  // une danse : une durée et des pistes ; les canaux absents gardent la pose de repos
  function danse(duree, pistes) {
    const f = Object.fromEntries(Object.entries(pistes).map(([k, v]) => [k, typeof v === 'function' ? v : typeof v === 'number' ? () => v : piste(v)]));
    return { duree, pose: (ms) => { const p = { ...POSE }; for (const k in f) p[k] = f[k](ms); return p; } };
  }
  const P = POSE;

  const DANSES = {
    // 1. il se tasse, bondit, le chapeau s'envole en tournant et retombe sur la pomme
    hourra: danse(2600, {
      y: [[0, 0], [260, -6, 'out'], [650, 175, 'out'], [900, 175, 'lin'], [1220, 0, 'in'], [1400, 0], [1560, 70, 'out'], [1740, 0, 'in'], [2600, 0]],
      sy: [[0, 1], [260, .78, 'out'], [380, 1.16, 'out'], [700, 1.02], [1200, 1.08], [1260, .8, 'out'], [1420, 1.06, 'out'], [1560, 1], [1740, .88, 'in'], [1950, 1, 'ressort']],
      sx: [[0, 1], [260, 1.14, 'out'], [380, .9, 'out'], [700, 1], [1200, .96], [1260, 1.14, 'out'], [1420, .97, 'out'], [1560, 1], [1740, 1.08, 'in'], [1950, 1, 'ressort']],
      teteY: [[0, 0], [260, -14, 'out'], [420, 26, 'out'], [900, 10], [1260, -20, 'out'], [1500, 6, 'out'], [1950, 0, 'ressort']],
      chapY: [[0, 0], [300, -10], [560, 110, 'out'], [1020, 140, 'out'], [1360, 0, 'in'], [1460, -14, 'out'], [1700, 0, 'ressort']],
      chapRot: [[0, 0], [380, 0], [1300, 360, 'io'], [2600, 360]],
      aG: [[0, P.aG], [260, 150, 'out'], [420, 222, 'out'], [1200, 228], [1300, 175, 'out'], [2000, P.aG, 'ressort']],
      aD: [[0, P.aD], [260, 15, 'out'], [420, -62, 'out'], [1200, -66], [1300, -40, 'out'], [2000, P.aD, 'ressort']],
      bG: [[0, P.bG], [420, 34], [1200, 30], [2000, P.bG]],
      mainG: [[0, 'pendante'], [260, 'paume'], [1500, 'pendante']], mainD: [[0, 'pendante'], [260, 'paume'], [1500, 'pendante']],
      joie: [[0, 0], [300, 1, 'out'], [1900, 1], [2200, 0]],
      pG: (ms) => (ms < 400 || ms > 1250 ? P.pG : 25 * Math.sin((ms - 400) / 850 * 4 * Math.PI)),
      pD: (ms) => (ms < 400 || ms > 1250 ? P.pD : -25 * Math.sin((ms - 400) / 850 * 4 * Math.PI)),
      sourcils: [[0, 0], [300, 16, 'out'], [1900, 14], [2300, 0]],
      etoiles: [[0, -1], [500, 0], [1500, 1, 'lin']],
    }),
    // 2. il se balance en rythme, le chapeau salue à chaque temps
    chapeau: danse(2800, {
      pli: (ms) => (ms > 2500 ? 0 : 9 * Math.sin(ms / 2500 * 4 * Math.PI) * Math.min(1, ms / 200, (2500 - ms) / 200)),
      x: (ms) => (ms > 2500 ? 0 : 26 * Math.sin(ms / 2500 * 4 * Math.PI) * Math.min(1, ms / 200, (2500 - ms) / 200)),
      y: (ms) => (ms > 2500 ? 0 : 34 * Math.abs(Math.sin(ms / 2500 * 4 * Math.PI))),
      sy: (ms) => (ms > 2500 ? 1 : 1 - .08 * (1 - Math.abs(Math.sin(ms / 2500 * 4 * Math.PI)))),
      sx: (ms) => (ms > 2500 ? 1 : 1 + .06 * (1 - Math.abs(Math.sin(ms / 2500 * 4 * Math.PI)))),
      teteRot: (ms) => (ms > 2500 ? 0 : -8 * Math.sin(ms / 2500 * 4 * Math.PI - .5)),
      teteX: (ms) => (ms > 2500 ? 0 : -14 * Math.sin(ms / 2500 * 4 * Math.PI - .4)),
      chapY: (ms) => (ms > 2500 ? 0 : 50 * Math.max(0, Math.sin(ms / 2500 * 8 * Math.PI))),
      chapRot: (ms) => (ms > 2500 ? 0 : -18 * Math.sin(ms / 2500 * 8 * Math.PI)),
      regardX: (ms) => (ms > 2500 ? 0 : 9 * Math.sin(ms / 2500 * 4 * Math.PI)),
      aG: (ms) => (ms > 2500 ? P.aG : 205 + 28 * Math.sin(ms / 2500 * 8 * Math.PI)),
      aD: (ms) => (ms > 2500 ? P.aD : -25 - 28 * Math.sin(ms / 2500 * 8 * Math.PI)),
      bG: (ms) => (ms > 2500 ? P.bG : 22 * Math.sin(ms / 2500 * 8 * Math.PI)),
      bD: (ms) => (ms > 2500 ? P.bD : -22 * Math.sin(ms / 2500 * 8 * Math.PI)),
      mainG: [[0, 'pendante'], [150, 'coucou'], [2500, 'pendante']], mainD: [[0, 'pendante'], [150, 'coucou'], [2500, 'pendante']],
      sourcils: [[0, 0], [250, 10, 'out'], [2400, 10], [2700, 0]],
      sourcilsPli: (ms) => (ms > 2500 ? 0 : 6 * Math.sin(ms / 2500 * 4 * Math.PI)),
      pG: (ms) => (ms > 2500 ? P.pG : -20 * Math.sin(ms / 2500 * 8 * Math.PI)),
      pD: (ms) => (ms > 2500 ? P.pD : 20 * Math.sin(ms / 2500 * 8 * Math.PI)),
      etoiles: [[0, -1], [250, 0], [2600, 1, 'lin']],
    }),
    // 3. un saut avec un tour complet, puis « ta-da ! »
    toupie: danse(2600, {
      y: [[0, 0], [220, -4, 'out'], [600, 165, 'out'], [1000, 165, 'lin'], [1300, 0, 'in'], [2600, 0]],
      sy: [[0, 1], [220, .8, 'out'], [340, 1.12, 'out'], [1250, 1.05], [1320, .82, 'out'], [1600, 1, 'ressort']],
      sx: [[0, 1], [220, 1.12, 'out'], [340, .92, 'out'], [1250, .97], [1320, 1.12, 'out'], [1600, 1, 'ressort']],
      tour: [[0, 0], [360, 0], [1250, 720, 'io'], [2600, 720]],
      vitesse: [[0, 0], [380, 0], [560, .9, 'out'], [1050, .9], [1300, 0, 'in']],
      teteY: [[0, 0], [220, -12], [400, 20, 'out'], [1250, 8], [1330, -18, 'out'], [1700, 0, 'ressort']],
      chapY: [[0, 0], [300, -8], [700, 90, 'out'], [1100, 80], [1400, 0, 'in'], [1700, 0, 'ressort']],
      chapRot: [[0, 0], [600, -6], [1000, 6], [1300, 0]],
      aG: [[0, P.aG], [220, 140], [500, 120], [1250, 120], [1400, 190, 'rebond'], [2300, 190], [2600, P.aG]],
      aD: [[0, P.aD], [220, 40], [500, 60], [1250, 60], [1400, -10, 'rebond'], [2300, -10], [2600, P.aD]],
      bG: [[0, P.bG], [500, -10], [1400, -30], [2600, P.bG]],
      bD: [[0, P.bD], [500, 10], [1400, 30], [2600, P.bD]],
      mainD: [[0, 'pendante'], [220, 'poing-cote'], [1380, 'pouce'], [2450, 'pendante']],
      mainG: [[0, 'pendante'], [220, 'poing-cote'], [1380, 'pouce'], [2450, 'pendante']],
      joie: [[0, 0], [1330, 0], [1420, 1, 'out'], [2300, 1], [2550, 0]],
      sourcils: [[0, 0], [300, 12], [1300, 8], [1420, 18, 'rebond'], [2300, 16], [2600, 0]],
      etoiles: [[0, -1], [1350, 0], [2400, 1, 'lin']],
    }),
    // 4. deux coups de poing victorieux, clin d'œil, petit saut
    // 4. « Yes ! » : deux coups de poing vers le ciel, en bondissant de joie, et le V de la victoire ;
    //    les bras restent un moment en l'air, puis retombent avec leur poids (le poignet suit avec un temps de retard)
    // 5. « Bonjour ! » : trois bonds depuis le bord droit, tourné vers où il va ; il se pose, se tourne vers nous,
    //    s'incline pendant que son chapeau se soulève en basculant, fait coucou, puis le chapeau se repose
    bonjour: danse(3700, (() => {
      const SAUT = 380, NB = 3, FIN_SAUTS = SAUT * NB; // trois bonds de 380 ms
      const DEPART = 760; // hors de la scène, à droite
      const bond = (ms) => { const k = Math.min(NB - 1, Math.floor(ms / SAUT)); return [k, (ms - k * SAUT) / SAUT]; };
      // pendant les bonds, une valeur calculée ; ensuite, des clés
      const puis = (f, cles) => { const g = piste(cles); return (ms) => (ms < FIN_SAUTS ? f(ms) : g(ms)); };
      // un bond, de 0 à 1000 : écrasé au départ, détendu et étiré en l'air, écrasé à l'arrivée
      const LAME_SY = piste([[0, .76], [140, 1.16, 'out'], [300, 1.06, 'io'], [700, 1.04], [860, 1.02], [1000, .78, 'in']]);
      const LAME_PLI = piste([[0, -12], [150, -6, 'out'], [450, 5, 'io'], [750, 2, 'io'], [1000, -11, 'in']]);
      return {
        x: (ms) => { if (ms >= FIN_SAUTS) return 0; const [k, q] = bond(ms); const a = DEPART * (1 - k / NB), b = DEPART * (1 - (k + 1) / NB); return a + (b - a) * EASE.io(q); },

  DANSES.front = (() => {
    const EPAULE = { G: [442, 580], D: [580, 566] };
    const BEND = { G: -42, D: 20 };
    // le bras qui vise le point (x, y) ; dir : direction du bras qui entre dans le gant (en degrés)
    function viser(cote, x, y, dir) {
      const [ex, ey] = EPAULE[cote], b = BEND[cote];
      let a = Math.atan2(y - ey, x - ex) * 180 / Math.PI;
      if (cote === 'G' && a < 0) a += 360;
      const L = Math.hypot(x - ex, y - ey), t = Math.atan2(-b, L / 2) * 180 / Math.PI;
      return { a, b, lg: L / 138, p: dir - a - t };
    }
    const repos = (cote) => ({ a: P['a' + cote], b: P['b' + cote], lg: 1, p: P['p' + cote] });
    const mix = (u, v, k) => ({ a: u.a + (v.a - u.a) * k, b: u.b + (v.b - u.b) * k, lg: u.lg + (v.lg - u.lg) * k, p: u.p + (v.p - u.p) * k });

    const sy = piste([[0, 1], [1500, 1], [ELAN, 1.04, 'out'], [1880, 1.05], [CHOC, .9, 'in'], [2200, 1, 'ressort'], [2950, 1], [3150, 1.05, 'io'], [3450, .97, 'io'], [3700, 1, 'io']]);

  // 12. « Bravo, quel coup ! » : une révérence élégante (la main sur le cœur, l'autre bras ouvert), mais le chapeau

  DANSES.reverence = (() => {

    function surTete(ms, chapY = 0) {
      const p = q(ms);

      const tx = nx - 508, ty = ny - 458 - 12 - p.teteY;
      return [508 + tx + p.x, 205 + ty - (chapY - SUR_TETE) - p.y, p.teteRot];
    }
    // le chapeau libre : il tombe en tournoyant, rebondit, reste par terre, puis la main le remonte sur la tête
    const LACHE = 900, SOL = 1360, PRISE = 2300, POSE_ = 2900;

      const [x1, y1, r1] = surTete(POSE_);

      clinG: [[0, 0], [550, 0], [800, 1, 'io'], [1300, 1], [1400, 0, 'out']],
      clinD: [[0, 0], [550, 0], [800, 1, 'io'], [1300, 1], [1400, 0, 'out']],
      sourcils: [[0, 0], [400, 8, 'io'], [1300, 6], [1450, 24, 'out'], [2000, 18], [2900, 10], [3200, 4], [4000, 0]],
      sourcilsPli: [[0, 0], [1450, 0], [1550, 6], [2900, 6], [3200, 0]],
      regardX: [[0, 0], [1400, 0], [1500, 9, 'out'], [2200, 6], [2600, 2], [3100, 0], [3700, -6, 'io'], [4100, 0, 'io']],
      regardY: [[0, 0], [1400, 0], [1500, 9, 'out'], [2200, 9], [2600, -9, 'io'], [2900, -6], [3100, 0, 'io']],
      joie: [[0, 0], [3050, 0], [3100, 1], [3350, 1], [3400, 0]],
    });
  })();
  // 13. « Dab ! » : un double dab. Clac, vers la droite : un bras tendu en diagonale, l'autre courbé devant le visage, la
  //     tête penchée dedans, les yeux fermés ; clac, la même chose vers la gauche ; puis retour au repos.
  DANSES.dab = (() => {
    // une pose de dab vers la droite ; vers la gauche, c'est le miroir
    const DROITE = {
      aD: -45, bD: 0, lgD: 1.9, pD: 0, mainD: 'ouverte',           // le bras tendu, en diagonale vers le haut
      aG: 300, bG: -70, lgG: 2.1, pG: -10, mainG: 'ouverte',       // le bras courbé en travers du visage
      devantG: 1, devantD: 0,
      teteRot: -18, teteY: -24, teteX: -8, chapRot: -8, pli: 5, penche: 45,
    };
    const miroir = (d) => ({
      aD: 180 - d.aG, bD: -d.bG, lgD: d.lgG, pD: -d.pG, mainD: d.mainG,
      aG: 180 - d.aD, bG: -d.bD, lgG: d.lgD, pG: -d.pD, mainG: d.mainD,
      devantG: d.devantD, devantD: d.devantG,
      teteRot: -d.teteRot, teteY: d.teteY, teteX: -d.teteX, chapRot: -d.chapRot, pli: -d.pli, penche: d.penche,
    });
    const GAUCHE = miroir(DROITE);
    // les clés de chaque canal : repos, dab à droite (clac à 400 ms), dab à gauche (clac à 1350 ms), repos
    const cle = (k, repos) => [[0, repos], [230, repos], [400, DROITE[k], 'rebond'], [1080, DROITE[k]], [1350, GAUCHE[k], 'rebond'], [1950, GAUCHE[k]], [2350, repos, 'io']];
    const d = {};
    for (const k of ['aD', 'bD', 'lgD', 'pD', 'aG', 'bG', 'lgG', 'pG', 'teteRot', 'teteY', 'teteX', 'chapRot', 'pli', 'penche']) d[k] = cle(k, k.startsWith('lg') ? 1 : POSE[k]);
    // l'angle du bras gauche passe par le haut (300° = -60°) : on garde des valeurs continues
    d.aG = [[0, P.aG], [230, P.aG], [400, DROITE.aG, 'rebond'], [1080, DROITE.aG], [1350, 180 - DROITE.aD, 'rebond'], [1950, 180 - DROITE.aD], [2350, P.aG, 'io']];
    d.aD = [[0, P.aD], [230, P.aD], [400, DROITE.aD, 'rebond'], [1080, DROITE.aD], [1350, 180 - DROITE.aG, 'rebond'], [1950, 180 - DROITE.aG], [2350, P.aD, 'io']];
    return danse(2400, {
      ...d,
      mainD: [[0, 'pendante'], [300, 'ouverte'], [2150, 'pendante']], mainG: [[0, 'pendante'], [300, 'ouverte'], [2150, 'pendante']],
      devantG: [[0, 0], [300, 1], [1200, 0]], devantD: [[0, 0], [1200, 1], [2100, 0]],
      // l'élan, puis un petit saut à chaque clac
      sy: [[0, 1], [230, .9, 'io'], [400, 1.06, 'out'], [560, 1, 'io'], [1180, .94, 'io'], [1350, 1.06, 'out'], [1500, 1, 'io']],
      sx: [[0, 1], [230, 1.06, 'io'], [400, .96, 'out'], [560, 1, 'io'], [1180, 1.04, 'io'], [1350, .96, 'out'], [1500, 1, 'io']],
      y: [[0, 0], [230, -4], [400, 26, 'out'], [560, 0, 'in'], [1180, 0], [1350, 26, 'out'], [1500, 0, 'in']],
      chapY: [[0, 0], [400, 14, 'out'], [600, 0, 'in'], [1350, 16, 'out'], [1550, 0, 'in']],
      // les yeux fermés, l'air cool ; les sourcils levés
      clinG: [[0, 0], [330, 0], [400, 1], [1180, 1], [1240, 0], [1300, 1], [2050, 1], [2150, 0]],
      clinD: [[0, 0], [330, 0], [400, 1], [1180, 1], [1240, 0], [1300, 1], [2050, 1], [2150, 0]],
      sourcils: [[0, 0], [400, 10, 'out'], [2000, 10], [2350, 0]],
      etoiles: [[0, -1], [420, 0], [2300, 1, 'lin']],
    });
  })();
  // 14. le floss : les deux bras tendus, poings serrés, balancent d'un côté à l'autre en passant tour à tour devant et
  //     derrière le corps, pendant que les hanches partent dans l'autre sens
  DANSES.floss = (() => {
    const DEBUT = 250, T = 270, N = 10, FIN = DEBUT + N * T, DUREE = FIN + 450;
    // u : où sont les bras, de -1 (à gauche) à +1 (à droite) ; ils marquent un petit temps à chaque bout
    const u = (ms) => {
      if (ms <= DEBUT) return -1;
      if (ms >= FIN) return N % 2 ? 1 : -1;
      const c = -Math.cos(Math.PI * (ms - DEBUT) / T);
      return Math.sign(c) * Math.pow(Math.abs(c), .55);
    };
    // A : l'ampleur, de 0 (repos) à 1 (floss), pour entrer et sortir en douceur
    const A = piste([[0, 0], [DEBUT, 1, 'io'], [FIN, 1], [DUREE - 50, 0, 'io']]);
    const melanger = (repos, cible) => (ms) => repos + (cible(u(ms)) - repos) * A(ms);
    const enRythme = (f) => (ms) => f(u(ms)) * A(ms);
    return danse(DUREE, {
      aG: melanger(P.aG, (v) => 99 - 64 * v), aD: melanger(P.aD, (v) => 81 - 64 * v),
      bG: melanger(P.bG, (v) => -6 * v), bD: melanger(P.bD, (v) => -6 * v),
      lgG: melanger(1, () => 1.3), lgD: melanger(1, () => 1.3),
      pG: melanger(P.pG, () => 0), pD: melanger(P.pD, () => 0),
      mainG: [[0, 'pendante'], [DEBUT - 120, 'poing-bas'], [FIN + 150, 'pendante']],
      mainD: [[0, 'pendante'], [DEBUT - 120, 'poing-bas'], [FIN + 150, 'pendante']],
      // le bras du côté où vont les bras passe derrière le corps, l'autre en travers devant
      derriereG: (ms) => (A(ms) > .3 && u(ms) < 0 ? 1 : 0), derriereD: (ms) => (A(ms) > .3 && u(ms) > 0 ? 1 : 0),
      // les hanches dans l'autre sens, la tête qui suit les bras ; un petit rebond à chaque passage au milieu
      x: enRythme((v) => -13 * v), pli: enRythme((v) => -6 * v), rot: enRythme((v) => 2 * v),
      teteX: enRythme((v) => 7 * v), teteRot: enRythme((v) => 7 * v), chapRot: enRythme((v) => 4 * v),
      y: enRythme((v) => 7 * (1 - Math.abs(v))), sy: (ms) => 1 - .035 * Math.abs(u(ms)) * A(ms),
      joie: [[0, 0], [DEBUT, 1], [FIN + 100, 0]],
      sourcils: [[0, 0], [DEBUT, 8, 'out'], [FIN, 8], [DUREE, 0]],
    });
  })();

  const NOMS = { hourra: 'Hop, hourra !', chapeau: 'La danse du chapeau', toupie: 'La toupie', yes: 'Yes !', bonjour: 'Bonjour !', reflechit: 'Hmm…', eureka: 'Eurêka !', triste: 'Oh non…', front: 'Oh là là !', endort: 'Il s\'endort…', dort: 'Il dort', reveil: 'Réveil !', reverence: 'Quel beau coup !', dab: 'Dab !', floss: 'Le floss' };
  // fondu : on part de la pose affichée (fin d'une danse, ou repos) et on glisse vers la suivante, sans à-coup
  const FONDU_DEBUT = 220, FONDU_FIN = 650;
  let derniere = null, fondu = null; // fondu = { depuis: pose, t0, duree }
  // les rotations prennent le chemin le plus court (un chapeau qui a fait un tour complet est déjà à l'endroit) ;
  // les effets (étoiles, bulles, étincelle, traits de vitesse) ne se mélangent pas : ils prennent tout de suite leur état
  const ANGLES = ['chapRot', 'tour', 'rot', 'aG', 'aD'];
  const SANS_FONDU = ['etoiles', 'pensee', 'etincelle', 'vitesse', 'ampoule', 'rayons', 'nuage', 'pluie', 'zzz', 'zzzVisible'];
  function melange(a, b, k) {
    const p = {};
    for (const c in b) {
      if (SANS_FONDU.includes(c) || typeof b[c] !== 'number' || typeof a[c] !== 'number') { p[c] = typeof b[c] === 'number' || SANS_FONDU.includes(c) ? b[c] : (k < .5 ? a[c] : b[c]); continue; }
      let d = b[c] - a[c];
      if (ANGLES.includes(c)) d = ((d % 360) + 540) % 360 - 180;
      p[c] = b[c] - d * (1 - k);
    }
    return p;
  }
  function lancer(nom) {
    enCours = nom;
    debut = performance.now();
    if (derniere) fondu = { depuis: derniere, t0: debut, duree: FONDU_DEBUT };
    legende.textContent = NOMS[nom];
    document.querySelectorAll('.danse').forEach(b => b.classList.toggle('active', b.dataset.danse === nom));
  }
  function image(now) {
    let p;
    if (enCours) {
      const d = DANSES[enCours];
      const ms = (now - debut) * vitesse;
      const duree = enCours === 'reflechit' && file[0] === 'eureka' ? COUPE_REFLEXION : d.duree;
      if (ms >= duree) {
        const fin = d.pose(duree);
        if (file.length) { derniere = fin; lancer(file.shift()); }
        else if (boucle || enCours === 'dort') { derniere = fin; lancer(enCours); }
        else {
          enCours = null;
          fondu = { depuis: fin, t0: now, duree: FONDU_FIN / vitesse };
          legende.textContent = 'Pom\' flotte';
          document.querySelectorAll('.danse').forEach(b => b.classList.remove('active'));
        }
        p = enCours ? DANSES[enCours].pose(0) : repos(now);
      } else p = d.pose(ms);
    } else p = repos(reduit ? 0 : now);
    if (fondu) {
      const k = (now - fondu.t0) / fondu.duree;
      if (k >= 1) fondu = null;
      else p = melange(fondu.depuis, p, EASE.io(Math.max(0, k)));
    }
    derniere = p;
    dessiner(p);
    requestAnimationFrame(image);
  }
  document.querySelectorAll('.danse').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.suite) { const [premiere, ...suite] = b.dataset.suite.split(' '); file = suite; lancer(premiere); return; }
    file = []; lancer(b.dataset.danse);
  }));
  $('toutes').addEventListener('click', () => { file = ['hourra', 'chapeau', 'toupie', 'yes', 'reflechit', 'eureka', 'triste', 'front', 'reverence', 'dab', 'floss', 'endort']; lancer('bonjour'); });
  $('ralenti').addEventListener('click', (e) => { vitesse = vitesse === 1 ? .5 : 1; e.currentTarget.setAttribute('aria-pressed', vitesse !== 1); });
  $('boucle').addEventListener('click', (e) => { boucle = !boucle; e.currentTarget.setAttribute('aria-pressed', boucle); });

  // couleur de Pom' et fond de la scène
  let couleur = 'auto', fond = 'clair';
  const appliquer = () => {
    scene.dataset.fond = fond;
    peindre(couleur === 'auto' ? (fond === 'sombre' ? 'blanc' : 'noir') : couleur);
  };
  document.querySelectorAll('[data-couleur]').forEach(b => b.addEventListener('click', () => {
    couleur = b.dataset.couleur;
    document.querySelectorAll('[data-couleur]').forEach(x => x.setAttribute('aria-pressed', x === b));
    appliquer();
  }));
  document.querySelectorAll('[data-chapeau]').forEach(b => b.addEventListener('click', () => {
    chapeauSurTete = b.dataset.chapeau === 'tete';
    document.querySelectorAll('[data-chapeau]').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
  document.querySelectorAll('[data-fond]').forEach(b => b.addEventListener('click', () => {
    fond = b.dataset.fond;
    document.querySelectorAll('[data-fond]').forEach(x => x.setAttribute('aria-pressed', x === b));
    appliquer();
  }));
  appliquer();
  // la galerie des mains
  $('grille-mains').innerHTML = Object.entries(MAINS).map(([id, m]) => {
    const [x, y, w, h] = m.boite, c = Math.max(w, h) + 16;
    return `<figure class="carte-main" style="margin:0"><svg viewBox="${x + w / 2 - c / 2} ${y + h / 2 - c / 2} ${c} ${c}" aria-hidden="true"><use href="#main-${id}"/></svg>` +
      `<b>${m.nom}</b><span>${m.deux || (m.cote === 'G' ? 'main droite de Pom\'' : 'main gauche de Pom\'')}</span></figure>`;
  }).join('');
  window.Pom = { dessiner, DANSES, repos, lancer, POSE, MAINS };
  requestAnimationFrame(image);
})();
</script>
