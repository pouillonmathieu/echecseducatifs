# L'application Android : construite à chaque modification du site (ou de l'application) sur main, puis publiée dans
# la version « android » du dépôt : https://github.com/pouillonmathieu/echecseducatifs/releases/tag/android
# (le fichier à installer : pomchess.apk). Voir android/README.md.
name: Application Android

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'jeux/**'
      - 'en/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Construire l'APK
        working-directory: android
        env:
          NUMERO_VERSION: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../pomchess.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pomchess
          path: pomchess.apk

      - name: Publier dans la version « android » du dépôt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android >/dev/null 2>&1; then
            gh release create android --title "Application Android" --latest=false \
              --notes "Pom'chess, l'application Android (tout le site, hors ligne). Sur le téléphone : télécharger pomchess.apk, puis l'ouvrir pour l'installer (autoriser l'installation depuis le navigateur si Android le demande). Refaite automatiquement à chaque modification du site."
          fi
          gh release edit android --title "Pom'chess pour Android"
          gh release upload android pomchess.apk --clobber
          # (l'ancien nom de l'application)
          gh release delete-asset android mini-jeux-echecs.apk -y 2>/dev/null || true
