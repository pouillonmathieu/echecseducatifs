        </button>
        <button id="reg-face" class="ligne-reglage" type="button">
          <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M9.5 7.5h5M9.5 16.5h5"/></svg>

  <section class="zone zone-noir" data-cote="noir" aria-label="Black's dice">
    <div class="zone-tete">
      <span class="zone-nom"><span class="puce-camp noir" aria-hidden="true"></span>Black</span>
      <span class="zone-etat" id="etat-noir"></span>
    </div>
    <div class="des" id="des-noir"></div>
    <button class="lancer" id="lancer-noir" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-de"/></svg>Roll the dice
    </button>
    <button class="terminer" id="terminer-noir" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>End my turn
    </button>
  </section>

  <section class="milieu" aria-label="Game">
    <p class="numero-tour" id="numero-tour">Turn 1</p>
    <div class="actions-milieu">
      <button id="btn-annuler" class="bouton-secondaire petit" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo
      </button>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l4 4 4-7 4 7 4-4-2 11H6Z"/></svg>King captured
      </button>
    </div>
    <details class="historique">
      <summary>Roll history</summary>
      <ol id="historique"></ol>
    </details>
  </section>

  <section class="zone zone-blanc" data-cote="blanc" aria-label="White's dice">
    <div class="zone-tete">
      <span class="zone-nom"><span class="puce-camp blanc" aria-hidden="true"></span>White</span>
      <span class="zone-etat" id="etat-blanc"></span>
    </div>
    <div class="des" id="des-blanc"></div>
    <button class="lancer" id="lancer-blanc" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-de"/></svg>Roll the dice
    </button>
    <button class="terminer" id="terminer-blanc" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>End my turn
    </button>
  </section>

  <footer class="signature">Made by Mathieu Pouillon</footer>

<!-- écran d'entrée : règles ou partie -->
<div id="entree" class="voile">
  <div class="carte-entree" role="dialog" aria-modal="true" aria-labelledby="entree-titre">
    <div class="entree-des" id="entree-des" aria-hidden="true"></div>
    <h2 id="entree-titre">Dice chess</h2>
    <p>Chess with dice: every turn, the dice choose which pieces you'll move. Set up a real chessboard, and roll the dice here.</p>
    <div class="entree-actions">
      <button id="btn-apprendre" class="bouton-secondaire" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5Z"/><path d="M12 6v13.5"/></svg>
        Learn the rules
      </button>
      <button id="btn-reprendre" class="bouton-principal" type="button" hidden>Resume the game</button>
      <button id="btn-commencer" class="bouton-principal" type="button">New game</button>
    </div>
  </div>
</div>

<!-- règles, en plusieurs étapes -->
<div id="regles" class="voile" hidden>
  <div class="carte-regles" role="dialog" aria-modal="true" aria-labelledby="regle-titre">
    <div class="carte-choix-tete">
      <p class="regle-compteur" id="regle-compteur">1 / 6</p>
      <button id="btn-fermer-regles" class="bouton-icone" type="button" aria-label="Close the rules" title="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="regle-illus" id="regle-illus" aria-hidden="true"></div>
    <h2 id="regle-titre"></h2>
    <div class="regle-texte" id="regle-texte"></div>
    <div class="regle-nav">
      <button id="regle-prec" class="bouton-secondaire" type="button">Previous</button>
      <ol class="points regle-points" id="regle-points" aria-hidden="true"></ol>
      <button id="regle-suiv" class="bouton-principal" type="button">Next</button>
    </div>
  </div>
</div>

<div id="fin" class="voile" hidden>

    <div id="fin-choix">
      <h2 id="fin-titre" class="res-titre">Who captured the king?</h2>
      <div class="fin-camps">
        <button class="fin-camp blanc" type="button" data-gagnant="blanc"><span class="puce-camp blanc grande" aria-hidden="true"></span>White</button>
        <button class="fin-camp noir" type="button" data-gagnant="noir"><span class="puce-camp noir grande" aria-hidden="true"></span>Black</button>
      </div>
      <button id="fin-annuler" class="bouton-secondaire" type="button">The game goes on</button>
    </div>
    <div id="fin-victoire" hidden>
      <div class="couronne" aria-hidden="true">
        <svg viewBox="0 0 100 100"><use id="fin-roi" href="#piece-roi-blanc"/></svg>
      </div>
      <h2 class="res-titre" id="fin-message">White wins!</h2>
      <p class="res-temps" id="fin-detail"></p>
      <div class="res-actions">
        <button id="fin-rejouer" class="bouton-principal" type="button">New game</button>
      </div>
    </div>
  </div>
</div>
