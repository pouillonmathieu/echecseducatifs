  <section class="jeu-aveugle">
    <div class="colonne-plateau">
      <!-- niveau de l'ordinateur et couleur du joueur -->

        <div class="choix-ligne choix-niveau" id="reg-niveau" role="group" aria-label="Computer level">

          <button type="button" data-niveau="2" title="Level 2"><svg viewBox="0 0 24 24" class="barres" aria-hidden="true"><rect x="2" y="17" width="4" height="4" rx="1.2" class="pleine"/><rect x="7.5" y="13" width="4" height="8" rx="1.2" class="pleine"/><rect x="13" y="9" width="4" height="12" rx="1.2" class="vide"/><rect x="18.5" y="5" width="4" height="16" rx="1.2" class="vide"/></svg></button>
          <button type="button" data-niveau="3" title="Level 3"><svg viewBox="0 0 24 24" class="barres" aria-hidden="true"><rect x="2" y="17" width="4" height="4" rx="1.2" class="pleine"/><rect x="7.5" y="13" width="4" height="8" rx="1.2" class="pleine"/><rect x="13" y="9" width="4" height="12" rx="1.2" class="pleine"/><rect x="18.5" y="5" width="4" height="16" rx="1.2" class="vide"/></svg></button>
          <button type="button" data-niveau="4" title="Level 4"><svg viewBox="0 0 24 24" class="barres" aria-hidden="true"><rect x="2" y="17" width="4" height="4" rx="1.2" class="pleine"/><rect x="7.5" y="13" width="4" height="8" rx="1.2" class="pleine"/><rect x="13" y="9" width="4" height="12" rx="1.2" class="pleine"/><rect x="18.5" y="5" width="4" height="16" rx="1.2" class="pleine"/></svg></button>
        </div>
        <div class="choix-ligne choix-couleur" id="reg-couleur" role="group" aria-label="Your colour">
          <button type="button" data-couleur="blanc" title="You play White"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#piece-roi-blanc"/></svg></button>
          <button type="button" data-couleur="noir" title="You play Black"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#piece-roi-noir"/></svg></button>
          <button type="button" data-couleur="hasard" title="Random colour"><svg viewBox="0 0 24 24" class="de" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></button>
        </div>
      </div>

      <!-- l'échiquier, caché : on le voit seulement pendant le « coup d'œil » -->
      <div class="cadre-aveugle" id="cadre-aveugle">
        <div id="echiquier" class="plateau-aveugle"></div>
        <div class="cache-plateau" id="cache-plateau" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 12s3.3-6 9-6 9 6 9 6-3.3 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.8"/><path d="M4 4l16 16"/></svg>
          <span>Hidden board</span>
        </div>
      </div>

      <!-- entre l'échiquier et la notation : le coup d'œil (tant qu'on appuie) et réécouter -->
      <div class="barre-oeil">
        <button id="btn-oeil" class="bouton-principal btn-oeil" type="button" title="Keep your finger pressed to see the board">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.3-6 9-6 9 6 9 6-3.3 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.8"/></svg>
          <span>Peek</span>
        </button>
        <span class="compte-oeil" id="compte-oeil" aria-live="polite" title="Peeks in this game">0</span>
        <button id="btn-reecouter" class="bouton-icone" type="button" aria-label="Hear the computer's move again" title="Hear the computer's move again">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>
        </button>
      </div>
    </div>

    <div class="panneau-aveugle">
      <!-- feuille de partie : toute la partie ; la case vide est le coup à jouer -->
      <div class="feuille feuille-aveugle" id="cadre-feuille">
        <table>
          <thead>
            <tr>
              <th class="num" scope="col"><span class="visuellement-cache">Move</span></th>
              <th scope="col"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#piece-roi-blanc"/></svg><span class="visuellement-cache">White</span></th>
              <th scope="col"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#piece-roi-noir"/></svg><span class="visuellement-cache">Black</span></th>
            </tr>
          </thead>
          <tbody id="feuille"></tbody>
        </table>
      </div>

      <p class="message" id="message" aria-live="polite" hidden></p>

      <form id="form-saisie" class="saisie" autocomplete="off">
        <button id="btn-valider" class="bouton-principal" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          Play
        </button>
        <button id="btn-dictee" class="bouton-icone" type="button" aria-label="Say your move out loud" title="Say your move" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
        </button>

        </button>
      </form>

      <!-- clavier à l'écran (rempli par aveugle.js) -->
      <div id="clavier" class="clavier" aria-label="Keyboard"></div>

      <div class="actions-partie actions-aveugle" data-icones-si-besoin>

          <span class="texte-bouton">Take back</span>
        </button>
        <button id="btn-abandonner" class="bouton-secondaire" type="button" title="Resign the game">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
          <span class="texte-bouton">Resign</span>
        </button>
        <button id="btn-nouvelle" class="bouton-secondaire" type="button" title="A new game">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="texte-bouton">New game</span>
        </button>
      </div>
    </div>
  </section>

<!-- confirmation (nouvelle partie, abandon) -->
<div id="confirmation" class="voile" hidden>
  <div class="carte-choix carte-confirmation" role="dialog" aria-modal="true" aria-labelledby="confirmation-titre">
    <h2 id="confirmation-titre">New game?</h2>
    <p class="carte-choix-intro" id="confirmation-texte">The current game will be lost.</p>
    <div class="res-actions">
      <button id="btn-confirmer" class="bouton-principal" type="button">Yes</button>
      <button id="btn-annuler-confirmation" class="bouton-secondaire" type="button">No, keep playing</button>
    </div>
  </div>
</div>

<!-- fin de la partie -->
<div id="resultats" class="voile" hidden>
  <div class="pluie" id="pluie" aria-hidden="true"></div>
  <div class="carte-resultats" role="dialog" aria-modal="true" aria-labelledby="res-titre">
    <div class="etoiles" id="etoiles" aria-hidden="true">

      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
    </div>
    <h2 id="res-titre" class="res-titre">Victory!</h2>
    <p class="res-detail" id="res-detail"></p>
    <ul class="res-stats" id="res-stats"></ul>
    <div class="res-actions">
      <button id="btn-res-nouvelle" class="bouton-principal" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New game
      </button>
      <button id="btn-res-voir" class="bouton-secondaire" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.3-6 9-6 9 6 9 6-3.3 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.8"/></svg>
        See the board
      </button>
    </div>
  </div>
