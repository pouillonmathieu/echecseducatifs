<main class="ecran ecran-note">
  <header class="barre">
    <a class="bouton-icone seulement-libre" href="../../index.html" aria-label="Back to home" title="Home" data-hors-artifact>
      <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h4.5v-5.5h3V20H18V9.5"/></svg>
    </a>
    <button id="btn-retour" class="bouton-icone bouton-illus seulement-defi" type="button" aria-label="Leave the challenge and go back to free mode" title="Free mode">
      <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-libre"/></svg>
    </button>
    <h1 class="titre" id="titre">Write the move</h1>
    <button id="btn-defis" class="bouton-defis seulement-libre" type="button" aria-haspopup="dialog" title="Challenges">
      <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-defi"/></svg>
      <span>Challenges</span>
    </button>
    <a class="bouton-icone bouton-langue" href="../../../jeux/notation/index.html" hreflang="fr" lang="fr" aria-label="Version française" title="Français" data-hors-artifact>FR</a>
    <button id="btn-theme" class="bouton-icone bouton-theme" type="button">
      <svg class="icone-lune" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
      <svg class="icone-soleil" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
    <div class="reglages">
      <button id="btn-reglages" class="bouton-icone" type="button" aria-label="Settings" title="Settings" aria-controls="panneau-reglages" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
      <div id="panneau-reglages" class="panneau" hidden>
        <div class="ligne-reglage-bloc">
          <span class="ligne-titre">
            <svg viewBox="0 0 24 24"><path d="M4 6h10M9 4v2M6 6c0 4 3 7 7 8M12 6c0 3-3 7-7 9"/><path d="M13 20l4-9 4 9M14.5 17h5"/></svg>
            Notation
          </span>
          <div class="segments" id="reg-langue" role="group" aria-label="Notation language">
            <button type="button" data-langue="fr">French<small>R D T F C</small></button>
            <button type="button" data-langue="en">English<small>K Q R B N</small></button>
          </div>
        </div>
        <button id="reg-clavier" class="ligne-reglage" type="button">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 9.5h1M9.5 9.5h1M13 9.5h1M16.5 9.5h1M6 12.5h1M9.5 12.5h1M13 12.5h1M16.5 12.5h1M8 15.5h8"/></svg>
          <span>On-screen keyboard<small>Otherwise, your device's keyboard</small></span><span class="interrupteur" aria-hidden="true"></span>
        </button>
        <button id="reg-tout-petits" class="ligne-reglage" type="button">
          <svg class="illus" viewBox="0 0 48 48"><use href="#animal-a"/></svg>
          <span>Little ones<small>Keyboard with pieces, animals and fingers</small></span><span class="interrupteur" aria-hidden="true"></span>
        </button>
        <button id="reg-coordonnees" class="ligne-reglage" type="button">
          <svg viewBox="0 0 24 24"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3.5 6v2M3.5 11v2M10 21h2M15 21h2"/></svg>
          <span>Letters and numbers</span><span class="interrupteur" aria-hidden="true"></span>
        </button>
        <button id="reg-son" class="ligne-reglage" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg>
          <span>Sound</span><span class="interrupteur" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- progression des défis -->
  <div class="bandeau-defi seulement-defi">
    <ol id="points" class="points" aria-label="Challenge progress"></ol>
    <div class="minuteur seulement-chrono" aria-hidden="true"><div id="minuteur-barre"></div></div>
  </div>

  <section class="jeu-note">
    <div class="colonne-plateau">
      <!-- niveau (mode libre) -->
      <div class="choix-jeu seulement-libre">
        <div class="choix-ligne choix-niveau" id="reg-niveau" role="group" aria-label="Level">
          <button type="button" class="avec-texte" data-niveau="facile" title="Simple moves"><svg viewBox="0 0 24 24" class="barres" aria-hidden="true"><rect x="3" y="16" width="5" height="5" rx="1.5" class="pleine"/><rect x="10" y="11" width="5" height="10" rx="1.5" class="vide"/><rect x="17" y="6" width="5" height="15" rx="1.5" class="vide"/></svg>Easy</button>
          <button type="button" class="avec-texte" data-niveau="difficile" title="Check, mate, castling, promotion…"><svg viewBox="0 0 24 24" class="barres" aria-hidden="true"><rect x="3" y="16" width="5" height="5" rx="1.5" class="pleine"/><rect x="10" y="11" width="5" height="10" rx="1.5" class="pleine"/><rect x="17" y="6" width="5" height="15" rx="1.5" class="pleine"/></svg>Hard</button>
        </div>
      </div>
      <div id="echiquier" class="plateau-note"></div>
    </div>

    <div class="panneau-note">
      <p class="question" id="question" aria-live="polite">
        <svg class="roi-question" viewBox="0 0 100 100" aria-hidden="true"><use id="roi-question" href="#piece-roi-blanc"/></svg>
        <span id="question-texte">Write White's move</span>
        <button id="btn-revoir" class="bouton-icone revoir" type="button" aria-label="Replay the last move" title="Replay the move">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4h4"/><path d="M10.5 9.5v5l4-2.5Z" class="plein"/></svg>
        </button>
      </p>

      <!-- feuille de partie : les 3 coups d'avant et une case vide pour le dernier -->
      <div class="feuille">
        <table>
          <thead>
            <tr>
              <th class="num" scope="col"><span class="visuellement-cache">Move</span></th>
              <th scope="col"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#piece-roi-blanc"/></svg><span class="visuellement-cache">White</span></th>
              <th scope="col"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#piece-roi-noir"/></svg><span class="visuellement-cache">Black</span></th>
            </tr>
          </thead>
          <tbody id="feuille"></tbody>
        </table>
      </div>

      <form id="form-saisie" class="saisie" autocomplete="off">
        <button id="btn-valider" class="bouton-principal" type="submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          Check
        </button>
        <button id="btn-clavier" class="bouton-icone" type="button" aria-label="Show or hide the on-screen keyboard" title="On-screen keyboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 9.5h1M9.5 9.5h1M13 9.5h1M16.5 9.5h1M6 12.5h1M9.5 12.5h1M13 12.5h1M16.5 12.5h1M8 15.5h8"/></svg>
        </button>
      </form>

      <!-- clavier du mode tout-petits (rempli par notation.js) -->
      <div id="clavier" class="clavier" hidden aria-label="Keyboard"></div>

      <div class="retour" id="retour" hidden aria-live="polite">
        <p class="verdict" id="verdict"></p>
        <p class="ta-reponse" id="ta-reponse" hidden></p>
        <p class="conseil" id="conseil" hidden></p>
        <div class="morceaux" id="morceaux"></div>
        <p class="explication" id="explication" hidden></p>
        <button id="btn-suivant" class="bouton-principal" type="button">
          Next
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <p class="score-libre seulement-libre" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        <span id="score-libre">0 / 0</span>
      </p>
      <p class="astuce">Write the move, then press <kbd>Enter</kbd> ; <kbd>Enter</kbd> again for the next one.</p>
    </div>
  </section>

  <footer class="signature">Made by Mathieu Pouillon</footer>
</main>

<!-- choix du défi -->
<div id="choix-defi" class="voile" hidden>
  <div class="carte-choix" role="dialog" aria-modal="true" aria-labelledby="choix-titre">
    <div class="carte-choix-tete">
      <h2 id="choix-titre">Challenges</h2>
      <button id="btn-fermer-choix" class="bouton-icone" type="button" aria-label="Close" title="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="carte-choix-intro">10 moves to write — <span id="choix-niveau">easy level</span></p>
    <div class="tuiles">
      <button id="mode-defi" class="tuile" type="button">
        <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-defi"/></svg>
        <span class="tuile-titre">No timer</span>
        <span class="tuile-sous">Take your time</span>
      </button>
      <button id="mode-chrono" class="tuile" type="button">
        <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-chrono"/></svg>
        <span class="tuile-titre">Timer</span>
        <span class="tuile-sous">20 seconds per move</span>
      </button>
    </div>
  </div>
</div>

<!-- résultats des défis -->
<div id="resultats" class="voile" hidden>
  <div class="pluie" id="pluie" aria-hidden="true"></div>
  <div class="carte-resultats" role="dialog" aria-modal="true" aria-labelledby="res-titre">

      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8Z"/></svg>
    </div>
    <h2 id="res-titre" class="res-titre">Well done!</h2>
    <p class="res-score"><span id="res-score">0</span><span class="res-sur">/ 10</span></p>
    <ol id="res-liste" class="res-liste" aria-label="Move details"></ol>
    <p id="res-temps" class="res-temps"></p>
    <div class="res-actions">
      <button id="btn-rejouer" class="bouton-principal" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4h4"/></svg>
        Play again
      </button>
      <button id="btn-menu" class="bouton-secondaire" type="button">
        <svg class="illus" viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-libre"/></svg>
        Free mode
      </button>
    </div>
  </div>
</div>
