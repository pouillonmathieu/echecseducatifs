  <!-- une ouverture (fiche.html?o=<identifiant>) -->
  <article class="fiche" id="fiche" hidden>
    <div class="fiche-haut">
      <div class="colonne-plateau">
        <div id="echiquier" class="plateau-fiche"></div>
        <div class="navigation-coups" id="navigation" role="group" aria-label="Review the moves">

        <h3>Key points</h3>
        <ul id="idees" class="fiche-idees"></ul>
        <div class="fiche-actions">
